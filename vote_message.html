<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vote Status | AI Online Voting System</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}


/* =========================================================
   BODY
========================================================= */

body{

    min-height:100vh;

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    color:#0f172a;

    background:

        radial-gradient(
            circle at 5% 5%,
            rgba(37,99,235,.10),
            transparent 28%
        ),

        radial-gradient(
            circle at 95% 95%,
            rgba(6,182,212,.09),
            transparent 30%
        ),

        #f4f7fb;

    display:flex;

    flex-direction:column;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{

    height:72px;

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    background:
        rgba(255,255,255,.94);

    border-bottom:
        1px solid #e2e8f0;

    box-shadow:
        0 5px 25px rgba(15,23,42,.05);

    backdrop-filter:
        blur(14px);

    position:relative;

    z-index:10;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;

    align-items:center;

    gap:11px;
}

.brand-logo{

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
        );

    box-shadow:
        0 8px 20px rgba(37,99,235,.22);

    font-size:19px;
}

.brand-text h1{

    font-size:13px;

    font-weight:800;

    letter-spacing:-.3px;
}

.brand-text span{

    display:block;

    margin-top:2px;

    color:#94a3b8;

    font-size:8px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   TOP RIGHT
========================================================= */

.top-actions{

    display:flex;

    align-items:center;

    gap:8px;
}

.home-btn{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    border:1px solid #e2e8f0;

    color:#64748b;

    background:#fff;

    text-decoration:none;

    transition:.2s;
}

.home-btn:hover{

    color:#2563eb;

    background:#eff6ff;

    border-color:#bfdbfe;

    transform:translateY(-1px);
}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        55px
        20px
        70px;
}


/* =========================================================
   STATUS WRAPPER
========================================================= */

.status-wrapper{

    width:
        min(560px, 100%);

    text-align:center;
}


/* =========================================================
   STATUS CARD
========================================================= */

.status-card{

    position:relative;

    overflow:hidden;

    background:#fff;

    border:
        1px solid #e2e8f0;

    border-radius:24px;

    padding:
        42px
        40px
        38px;

    box-shadow:

        0 20px 55px
        rgba(15,23,42,.10);

    animation:
        cardEnter .55s ease;
}


/* Top gradient line */

.status-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;

    height:5px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #06b6d4
        );
}


/* Decorative circle */

.status-card::after{

    content:"";

    position:absolute;

    width:210px;
    height:210px;

    top:-125px;
    right:-100px;

    border-radius:50%;

    background:
        rgba(37,99,235,.045);

    pointer-events:none;
}


/* =========================================================
   STATUS ICON
========================================================= */

.status-icon{

    position:relative;

    width:92px;
    height:92px;

    margin:
        0
        auto
        22px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:28px;

    color:#2563eb;

    background:

        linear-gradient(
            145deg,
            #eff6ff,
            #e0f2fe
        );

    border:
        1px solid #dbeafe;

    box-shadow:

        0 12px 30px
        rgba(37,99,235,.12);

    font-size:41px;

    animation:
        iconFloat 3s ease-in-out infinite;
}


/* Icon ring */

.status-icon::before{

    content:"";

    position:absolute;

    inset:-8px;

    border-radius:34px;

    border:
        1px solid
        rgba(37,99,235,.08);
}


/* =========================================================
   EYEBROW
========================================================= */

.status-label{

    display:inline-flex;

    align-items:center;

    gap:7px;

    margin-bottom:9px;

    padding:
        6px
        10px;

    border-radius:20px;

    color:#2563eb;

    background:#eff6ff;

    border:
        1px solid #dbeafe;

    font-size:8px;

    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;
}


/* =========================================================
   TITLE
========================================================= */

.status-card h1{

    margin-bottom:10px;

    color:#0f172a;

    font-size:27px;

    font-weight:800;

    letter-spacing:-.7px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message-box{

    margin:
        18px
        0
        24px;

    padding:
        17px
        18px;

    border-radius:13px;

    background:#f8fafc;

    border:
        1px solid #e2e8f0;
}

.message-box p{

    color:#475569;

    font-size:12px;

    font-weight:500;

    line-height:1.7;

    word-break:break-word;
}


/* =========================================================
   SECURITY INFO
========================================================= */

.security-note{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    margin-bottom:25px;

    color:#64748b;

    font-size:8px;
}

.security-note i{

    color:#16a34a;

    font-size:11px;
}


/* =========================================================
   BUTTON
========================================================= */

.dashboard-btn{

    width:100%;

    min-height:49px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    border-radius:11px;

    color:white;

    background:

        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    box-shadow:

        0 10px 24px
        rgba(37,99,235,.22);

    text-decoration:none;

    font-size:10px;

    font-weight:800;

    transition:

        transform .2s,
        box-shadow .2s,
        filter .2s;
}

.dashboard-btn:hover{

    color:white;

    transform:
        translateY(-2px);

    box-shadow:

        0 14px 30px
        rgba(37,99,235,.30);

    filter:
        brightness(1.04);
}

.dashboard-btn:active{

    transform:
        translateY(0)
        scale(.98);
}

.dashboard-btn i{

    font-size:14px;
}


/* =========================================================
   SECONDARY ACTION
========================================================= */

.secondary-actions{

    margin-top:14px;

    display:flex;

    justify-content:center;

    gap:8px;
}

.secondary-link{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        9px
        12px;

    color:#64748b;

    border-radius:9px;

    text-decoration:none;

    font-size:8px;

    font-weight:700;

    transition:.2s;
}

.secondary-link:hover{

    color:#2563eb;

    background:#eff6ff;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    padding:
        18px
        20px;

    text-align:center;

    color:#94a3b8;

    font-size:8px;

    border-top:
        1px solid #e2e8f0;

    background:
        rgba(255,255,255,.55);
}

.footer strong{

    color:#64748b;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes cardEnter{

    from{

        opacity:0;

        transform:
            translateY(18px)
            scale(.98);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes iconFloat{

    0%,
    100%{

        transform:
            translateY(0);
    }

    50%{

        transform:
            translateY(-4px);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .topbar{

        height:65px;

        padding:
            0
            15px;
    }

    .brand-text{

        display:none;
    }

    .main{

        padding:
            30px
            15px
            45px;
    }

    .status-card{

        padding:
            35px
            22px
            28px;

        border-radius:20px;
    }

    .status-icon{

        width:78px;
        height:78px;

        border-radius:23px;

        font-size:34px;
    }

    .status-card h1{

        font-size:23px;
    }

    .message-box p{

        font-size:11px;
    }

}


@media(max-width:380px){

    .status-card{

        padding:
            32px
            16px
            25px;
    }

    .status-card h1{

        font-size:21px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     TOP BAR
========================================================= -->

<header class="topbar">


    <div class="brand">


        <div class="brand-logo">

            <i class="bi bi-shield-check"></i>

        </div>


        <div class="brand-text">

            <h1>
                AI Online Voting System
            </h1>

            <span>
                Secure Voting Portal
            </span>

        </div>


    </div>


    <div class="top-actions">


        <a
            href="/voter"
            class="home-btn"
            title="Dashboard">

            <i class="bi bi-house-fill"></i>

        </a>


    </div>


</header>



<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="main">


    <div class="status-wrapper">


        <div class="status-card">


            <!-- Status Icon -->

            <div class="status-icon">

                <i class="bi bi-check2-circle"></i>

            </div>


            <!-- Label -->

            <div class="status-label">

                <i class="bi bi-shield-check"></i>

                Voting Status

            </div>


            <!-- Heading -->

            <h1>
                Vote Status
            </h1>


            <!-- Dynamic Flask Message -->

            <div class="message-box">

                <p>
                    {{ message }}
                </p>

            </div>


            <!-- Security Information -->

            <div class="security-note">

                <i class="bi bi-lock-fill"></i>

                Your voting activity is protected by
                the secure voting system.

            </div>


            <!-- Dashboard Button -->

            <a
                href="/voter"
                class="dashboard-btn">

                <i class="bi bi-grid-1x2-fill"></i>

                Back to Dashboard

                <i class="bi bi-arrow-right"></i>

            </a>


            <!-- Secondary Action -->

            <div class="secondary-actions">

                <a
                    href="/voter"
                    class="secondary-link">

                    <i class="bi bi-house"></i>

                    Dashboard

                </a>


                <a
                    href="/results"
                    class="secondary-link">

                    <i class="bi bi-bar-chart-fill"></i>

                    View Results

                </a>

            </div>


        </div>


    </div>

</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="footer">

    © 2026
    <strong>AI Online Voting System</strong>
    · Secure Digital Election Platform

</footer>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

/*
    Small interaction for the dashboard button.
*/

document
.querySelectorAll(".dashboard-btn, .secondary-link")
.forEach(function(button){

    button.addEventListener("click", function(){

        button.style.transform =
            "scale(.98)";

        setTimeout(function(){

            button.style.transform = "";

        },120);

    });

});

</script>


</body>

</html>
